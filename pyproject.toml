[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-checker"
version = "0.1.4"
description = "Find which local LLMs can run on your system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "Manjunath S Chinnagoudar", email = "manju@example.com" }
]
keywords = ["llm", "ai", "local-ai", "ollama", "hardware", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "psutil>=5.9",
  "questionary>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rapidfuzz>=3.0",
  "py-cpuinfo>=9.0",
  "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
local-llm-checker = "llm_checker.main:app"

[project.urls]
Homepage = "https://github.com/Manju-Chinnanagoudar/local-llm-checker"
Issues = "https://github.com/Manju-Chinnanagoudar/local-llm-checker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_checker"]
